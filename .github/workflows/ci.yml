name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # manual "Run workflow" (also builds the Windows executable)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check anantham tests tools
      - name: Unit + integration tests
        run: pytest -q
      - name: 10-second smoke benchmark
        run: anantham bench --smoke --out smoke_bench --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-bench-${{ matrix.os }}
          path: smoke_bench/benchmark_*

  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: PyInstaller one-folder build
        run: pyinstaller anantham.spec --noconfirm
      - name: Smoke-test the frozen build (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\ANANTHAM\ANANTHAM.exe run --preset circular --duration 3 --out frozen_smoke --no-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: ANANTHAM-windows
          path: dist/ANANTHAM
