# ANANTHAM preset (generated by `anantham presets` from bench/scenarios.py).
# Only overrides of the defaults are listed; every other field keeps its PS default.
target:
  motion: figure8
  speed_deg_s: 1.5
  distractors:
  - size_px: 6.0
    intensity_dn: 180.0
    motion: straight
    speed_deg_s: 0.6
disturbances:
  gaussian_sigma: 10.0
  poisson_gain: 0.5
  salt_pepper: true
  sp_fraction: 0.05
  atmosphere: haze
  turbulence:
    preset: moderate
  jitter_px: 10.0
  platform: circular
  platform_rate_px: 10.0
  platform_amplitude_px: 60.0
